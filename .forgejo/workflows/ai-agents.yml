name: Ignites AI Review

# Reviews ojars/ignites PRs via the Teika async review pipeline (ADR-003,
# single-council). Mirrors teika + SurfSense + infra-scripts.
# infra-docs#216 Tier-1 rollout. Slim PR-diff-review only (no agent_discussion).
#
# Auth: secrets.TEIKA_GATEWAY_JWT (= teika.surfsense_api_key in SOPS,
# fastapi-users JWT scoped to the SurfSense-as-service caller identity)
# and secrets.TEIKA_FORGEJO_TOKEN (Forgejo PAT for diff fetch). Teika posts
# the final comment and commit status with its own service credential.
#
# The legacy `<!-- ai-agent -->` PR-body skip-convention is intentionally
# OMITTED — retired 2026-05-01 per CLAUDE.md "Every PR must run through
# the Teika AI review" rule.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  ai-review:
    runs-on: self-hosted
    # The workflow only admits the job; Teika owns the long-running review.
    timeout-minutes: 5
    # One run at a time per PR. New push supersedes in-flight review.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Teika PR Review
        env:
          TEIKA_GATEWAY_JWT: ${{ secrets.TEIKA_GATEWAY_JWT }}
          TEIKA_FORGEJO_TOKEN: ${{ secrets.TEIKA_FORGEJO_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "TEIKA IGNITES REVIEW — PR #$PR_NUMBER ($REPO)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # 1. Fetch the unified diff from Forgejo.
          # --http1.1 dodges CF→yuno loopback `curl: (92) PROTOCOL_ERROR` —
          # see infra-docs#212 rollout (root: infra-docs#195 L4).
          # Stream the diff to a file — NEVER into a jq `--arg` value. A single
          # execve() argument is capped at MAX_ARG_STRLEN (128 KB on Linux),
          # independent of total ARG_MAX; a large PR diff as `--arg diff "$DIFF"`
          # → `jq: Argument list too long` (exit 126) and the council silently
          # never runs. Fixed first on infra-docs (#341/#342), rolled here.
          DIFF_FILE="${RUNNER_TEMP:-/tmp}/pr-${PR_NUMBER}.diff"
          curl -fsS --http1.1 -H "Authorization: token $TEIKA_FORGEJO_TOKEN" \
            "https://git.kapteinis.lv/api/v1/repos/$REPO/pulls/$PR_NUMBER.diff" \
            -o "$DIFF_FILE"
          echo "Diff size: $(wc -c < "$DIFF_FILE") chars"

          # 2. Build the request in a file so neither the diff nor JSON payload
          # hits Linux MAX_ARG_STRLEN.
          REQ_FILE="${RUNNER_TEMP:-/tmp}/pr-${PR_NUMBER}.req.json"
          jq -n \
            --arg repo "$REPO" \
            --argjson pr "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg sha "$COMMIT_SHA" \
            --rawfile diff "$DIFF_FILE" \
            '{repo:$repo, pr_number:$pr, title:$title, body:$body, commit_sha:$sha, diff:$diff}' > "$REQ_FILE"

          # 3. Admit the async review. Teika returns immediately, runs the
          # pipeline in the background, and owns the final comment/status.
          SUCCESS=0
          for attempt in 1 2 3; do
            if curl -sSf -X POST \
                  --max-time 30 \
                  -H "Authorization: Bearer $TEIKA_GATEWAY_JWT" \
                  -H "Content-Type: application/json" \
                  --data-binary @"$REQ_FILE" \
                  "http://100.64.0.5:8090/review/pr/async"; then
              SUCCESS=1
              break
            fi
            echo "Attempt $attempt failed — sleeping 10s before retry..."
            sleep 10
          done
          echo

          # A failed kick means no review exists, so fail the Actions run.
          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::Teika /review/pr/async kick failed after 3 attempts — review not started"
            exit 1
          fi
          echo "Async review kicked — Teika posts the comment + sets teika/ai-review."
